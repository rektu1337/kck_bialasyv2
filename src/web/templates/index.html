<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Trener - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Własne style CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h1 class="display-5">🏋️‍♂️ Cyber Trener Dashboard</h1>
            <p class="text-light text-opacity-75">Podsumowanie Twojej aktywności i analiza dokładności treningowej.</p>
        </div>
        <div class="col-md-4 text-end">
            <label for="userSelect" class="form-label">Wybierz profil:</label>
            <select id="userSelect" class="form-select bg-dark text-white border-secondary">
                <option value="">Wczytywanie...</option>
            </select>
        </div>
    </div>

    <!-- Statystyki ogólne -->
    <div class="row">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-header">Suma powtórzeń (OHP)</div>
                <div class="card-body">
                    <div class="stat-value" id="statTotalReps">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-header">Perfekcyjne powtórzenia</div>
                <div class="card-body">
                    <div class="stat-value" id="statPerfectReps" style="color: #2196F3;">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-header">Ogólna dokładność</div>
                <div class="card-body">
                    <div class="stat-value" id="statAccuracy" style="color: #FFC107;">0%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Wykresy -->
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">Historia Treningów (Ilość powtórzeń w czasie)</div>
                <div class="card-body">
                    <canvas id="historyChart" width="100%" height="30"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Własne skrypty JS -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
